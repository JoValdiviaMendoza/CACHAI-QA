name: CACHAI-QA QA Pipeline

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: URL pública que se va a escanear y probar
        required: true
        type: string
      max_pages:
        description: Máximo de páginas a escanear
        required: true
        default: "999999"
        type: string
      depth:
        description: Profundidad máxima del crawler
        required: true
        default: "999"
        type: string
      scan_type:
        description: Elementos que se van a extraer
        required: true
        default: all
        type: choice
        options:
          - all
          - links
          - images
          - forms
          - buttons
      engine:
        description: Motor de ejecución
        required: true
        default: both
        type: choice
        options:
          - playwright
          - cucumber
          - both
      browsers:
        description: Navegadores para Playwright
        required: true
        default: chromium
        type: choice
        options:
          - chromium
          - chromium,firefox
      max_links:
        description: Máximo de enlaces nuevos por página
        required: true
        default: "40"
        type: string
      fail_on_defects:
        description: Fallar el job si las pruebas detectan defectos
        required: true
        default: false
        type: boolean

# Ejemplo de ejecución programada (requiere configurar la variable CACHAI_TARGET_URL):
# schedule:
#   - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: cachai-qa-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  scan:
    name: Escanear URL
    runs-on: ubuntu-latest
    timeout-minutes: 120

    defaults:
      run:
        working-directory: src

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador del crawler
        run: npx playwright install --with-deps chromium

      - name: Validar TypeScript
        run: npx tsc --noEmit

      - name: Validar URL pública
        env:
          TARGET_URL: ${{ inputs.target_url || 'https://scrapethissite.com/' }}
        run: |
          node -e "
            const u = new URL(process.env.TARGET_URL);
            const h = u.hostname.toLowerCase().replace(/^\[|\]$/g, '');
            const p = h.split('.').map(Number);
            const privateIp = p.length === 4 && p.every((n) => Number.isInteger(n) && n >= 0 && n <= 255) && (
              p[0] === 10 || p[0] === 127 ||
              (p[0] === 172 && p[1] >= 16 && p[1] <= 31) ||
              (p[0] === 192 && p[1] === 168) ||
              (p[0] === 169 && p[1] === 254)
            );
            if (['localhost', '127.0.0.1', '::1', '0.0.0.0'].includes(h) || h.endsWith('.local') || privateIp) {
              console.error('GitHub Actions no puede acceder a localhost ni a una URL privada. Usa un túnel público o una URL accesible desde Internet.');
              process.exit(1);
            }
            console.log('URL remota válida:', u.toString());
          "

      - name: Ejecutar crawler
        env:
          TARGET_URL: ${{ inputs.target_url || 'https://scrapethissite.com/' }}
          SCAN_TYPE: ${{ inputs.scan_type || 'all' }}
          CRAWL_DEPTH: ${{ inputs.depth || '999' }}
          MAX_PAGES: ${{ inputs.max_pages || '999999' }}
        run: |
          npx ts-node --transpile-only crawler.ts \
            --url="$TARGET_URL" \
            --type="$SCAN_TYPE" \
            --depth="$CRAWL_DEPTH" \
            --max-pages="$MAX_PAGES" \
            --concurrency=3 \
            --headless \
            --output=scan-report/ci-scan.json

      - name: Validar scan generado
        run: |
          node -e "
            const fs = require('fs');
            const scan = JSON.parse(fs.readFileSync('scan-report/ci-scan.json', 'utf8'));
            if (!Array.isArray(scan.links) || scan.links.length === 0) {
              console.error('El scan no encontró enlaces. Verifica que la URL sea pública y accesible desde GitHub Actions.');
              process.exit(1);
            }
            console.log('Scan válido. Páginas:', scan.totalPages, 'Enlaces:', scan.links.length);
          "

      - name: Publicar scan JSON
        uses: actions/upload-artifact@v4
        with:
          name: scan
          path: src/scan-report/ci-scan.json
          if-no-files-found: error
          retention-days: 14

  test:
    name: Generar y ejecutar pruebas
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 180

    defaults:
      run:
        working-directory: src

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegadores
        run: npx playwright install --with-deps chromium firefox

      - name: Descargar scan del job anterior
        uses: actions/download-artifact@v4
        with:
          name: scan
          path: src/scan-report

      - name: Generar pruebas desde el scan
        env:
          BROWSERS: ${{ inputs.browsers || 'chromium' }}
          MAX_LINKS: ${{ inputs.max_links || '5' }}
        run: |
          npx ts-node --transpile-only cli/from-scan.ts \
            --scan=scan-report/ci-scan.json \
            --browsers="$BROWSERS" \
            --workers=2 \
            --max-links="$MAX_LINKS" \
            --timeout=60000 \
            --no-prompt \
            --no-open

      - name: Ejecutar Playwright
        id: playwright
        if: github.event_name == 'push' || inputs.engine != 'cucumber'
        continue-on-error: ${{ inputs.fail_on_defects != true }}
        run: >
          npx playwright test
          --config=reports/generated-tests/playwright.config.ts

      - name: Ejecutar Cucumber
        id: cucumber
        if: always() && inputs.engine != 'playwright'
        continue-on-error: ${{ inputs.fail_on_defects != true }}
        env:
          CUCUMBER_PARALLEL: "2"
        run: npx cucumber-js --config cucumber.js

      - name: Generar reporte de defectos
        env:
          ENGINE: ${{ inputs.engine || 'both' }}
        run: |
          node cli/report-defects.js "$ENGINE" \
            --scan=scan-report/ci-scan.json

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            src/scan-report/ci-scan.json
            src/reports/*.json
            src/reports/playwright-report-*
            src/reports/cucumber/**
            src/reports/defectos-*.md
            src/reports/generated-tests/**
